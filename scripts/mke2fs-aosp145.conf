# Host-build compatibility profile for AOSP's bundled e2fsprogs 1.45.4.
# Do not inherit the host /etc/mke2fs.conf: newer distributions enable ext4
# features (for example orphan_file) that this pinned tool cannot parse.
[defaults]
base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
default_mntopts = acl,user_xattr
enable_periodic_fsck = 0
blocksize = 4096
inode_size = 256
inode_ratio = 16384

[fs_types]
ext3 = {
    features = has_journal
}
ext4 = {
    features = has_journal,extent,huge_file,flex_bg,metadata_csum,metadata_csum_seed,64bit,dir_nlink,extra_isize
}
